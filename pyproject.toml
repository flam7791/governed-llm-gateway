[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "governed-llm-gateway"
version = "0.2.0"
description = "A small internal LLM gateway: routes each request to the cheapest adequate model (Claude, Azure OpenAI or a local open-weight model), masks personal data, enforces team budgets, produces chargeback reports and exposes Prometheus metrics."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Flavio Mericio" }]
keywords = ["llm", "gateway", "routing", "finops", "pii", "anthropic", "azure-openai", "ollama", "open-weight", "prometheus"]
dependencies = [
    "anthropic>=1.0,<2",  # Claude
    "fastapi>=0.110",     # HTTP API (OpenAI-compatible subset)
    "uvicorn>=0.29",      # ASGI server
    "httpx>=0.27,<1",     # OpenAI-compatible providers (Ollama) and Azure OpenAI
    "prometheus-client>=0.20",  # /metrics
]

[project.optional-dependencies]
azure = ["azure-identity>=1.15"]  # Microsoft Entra ID (managed identity) for Azure OpenAI
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
llmgw = "llmgw.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llmgw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

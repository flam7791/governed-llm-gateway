name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (offline, no API key or local model needed)
        run: pytest
      - name: Dependency vulnerability scan (the project's own dependencies)
        run: pip install pip-audit && pip-audit .
      - name: Replay the recorded routing evaluation
        if: hashFiles('evals/recordings/**') != ''
        run: |
          cp gateway.example.json gateway.json
          llmgw eval evals/tasks.jsonl --config gateway.json --recordings evals/recordings --offline

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t governed-llm-gateway .
      - name: Start it and check health, access control and metrics
        run: |
          docker run -d --name gw -p 127.0.0.1:8080:8080 \
            -v "$PWD/gateway.azure.example.json:/config/gateway.json:ro" \
            -e LLMGW_KEY_RESEARCH=ci-key governed-llm-gateway
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS -H "Authorization: Bearer ci-key" http://127.0.0.1:8080/v1/models
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/models)" = "401"
          curl -fsS http://127.0.0.1:8080/metrics | grep llmgw_budget_remaining_usd
      - name: Container logs
        if: always()
        run: docker logs gw
